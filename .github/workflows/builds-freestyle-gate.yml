name: Builds Freestyle Gate

on:
  pull_request:
    paths:
      - "builds/**"
      - "scripts/verify-builds-freestyle.mjs"
      - ".github/workflows/builds-freestyle-gate.yml"
  push:
    branches:
      - main
    paths:
      - "builds/**"
      - "scripts/verify-builds-freestyle.mjs"
      - ".github/workflows/builds-freestyle-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: builds-freestyle-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Gate self-test
        run: node scripts/verify-builds-freestyle.mjs --self-test
      - name: Verify builds
        run: node scripts/verify-builds-freestyle.mjs
