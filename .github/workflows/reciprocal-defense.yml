name: Reciprocal Defense Contract
on:
  pull_request:
    branches:
      - main
    paths:
      - security/reciprocal-defense.mjs
      - security/reciprocal-ingress.mjs
      - security/full-attack-unit.mjs
      - test/reciprocal-defense.test.mjs
      - test/reciprocal-ingress.test.mjs
      - test/full-attack-unit.test.mjs
      - .github/workflows/reciprocal-defense.yml
  push:
    branches:
      - feat/reciprocal-defense-hallway
    paths:
      - security/reciprocal-defense.mjs
      - security/reciprocal-ingress.mjs
      - security/full-attack-unit.mjs
      - test/reciprocal-defense.test.mjs
      - test/reciprocal-ingress.test.mjs
      - test/full-attack-unit.test.mjs
      - .github/workflows/reciprocal-defense.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reciprocal-defense-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  reciprocal-defense:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact proof head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned existing project reference
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false
      - name: Confirm exact head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # pinned version used by Chief
        with:
          node-version: '22'
      - name: Verify reciprocal defense, ingress, and full-unit invariants
        run: node --test test/reciprocal-defense.test.mjs test/reciprocal-ingress.test.mjs test/full-attack-unit.test.mjs
      - name: Verify full-unit observer binding
        run: grep -q "runFullAttackUnit" security/reciprocal-ingress.mjs
