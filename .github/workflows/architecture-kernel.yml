name: Self-Sufficient Architecture Kernel

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verify-architecture-kernel:
    name: Verify self-sufficient architecture kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Check out exact proof head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false
      - name: Verify exact proof head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - name: Verify architecture stays primary
        run: node scripts/verify-self-sufficient-architecture.mjs
