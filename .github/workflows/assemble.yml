name: Verify PromptOS source authority

on:
  pull_request:
    paths:
      - 'index.html'
      - 'parts/**.js'
      - 'control-room.manifest.json'
      - 'scripts/verify-control-room-tests.mjs'
      - '.github/workflows/assemble.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'parts/**.js'
      - 'control-room.manifest.json'
      - 'scripts/verify-control-room-tests.mjs'
      - '.github/workflows/assemble.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    name: Verify non-mutating index source graph
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false

      - name: Verify immutable head
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify canonical PromptOS source authority
        run: node scripts/verify-control-room-tests.mjs
