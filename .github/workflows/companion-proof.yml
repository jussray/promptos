name: Companion branch proof
on:
  push:
    branches: [feat/thinking-companions-prism-orion]
permissions:
  contents: read
jobs:
  companion-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify exact head and companion contract
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --check parts/app.js
          node --test test/companion-contract.test.mjs
