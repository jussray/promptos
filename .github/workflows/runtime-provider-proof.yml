name: Runtime Provider Proof

on:
  pull_request:
    branches:
      - main
    paths:
      - 'cloudflare-worker/**'
      - 'e2e/runtime-provider-proof.mjs'
      - '.github/workflows/runtime-provider-proof.yml'
      - 'wrangler.provider.jsonc'
      - 'scripts/prepare-provider-deploy*'
  push:
    branches:
      - main
    paths:
      - 'cloudflare-worker/**'
      - 'e2e/runtime-provider-proof.mjs'
      - '.github/workflows/runtime-provider-proof.yml'
      - 'wrangler.provider.jsonc'
      - 'scripts/prepare-provider-deploy*'
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact current main SHA approved for protected provider runtime deployment
        required: true
        type: string

permissions:
  contents: read

jobs:
  contract:
    name: Verify bounded provider runtime contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run provider proof contract tests
        run: node --test cloudflare-worker/runtime-proof.test.mjs cloudflare-worker/providers.test.mjs scripts/prepare-provider-deploy.test.mjs
      - name: Prove local protected Worker starts with the pinned runtime
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/promptos-local-fixtures.env"
          printf '%s\n' 'OPENAI_API_KEY=synthetic-provider-fixture' 'PROMPTOS_AI_OPERATOR_KEY=synthetic-operator-fixture' > "$fixture"
          npx --yes wrangler@4.110.0 dev --config wrangler.provider.jsonc \
            --local --ip 127.0.0.1 --port 8792 --env-file "$fixture" \
            --var "PROMPTOS_RELEASE_SHA:$SOURCE_SHA" --var PROMPTOS_OPENAI_MODEL:synthetic-model \
            > "$RUNNER_TEMP/promptos-local-worker.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true; rm -f "$fixture"' EXIT
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const url = 'http://127.0.0.1:8792/runtime-identity';
          let response;
          for (let attempt = 0; attempt < 60; attempt++) {
            try { response = await fetch(url); break; } catch { await new Promise(resolve => setTimeout(resolve, 1000)); }
          }
          assert.equal(response?.status, 401, 'local runtime must start and deny public callers');
          const authorized = await fetch(url, { headers: { Authorization: 'Bearer synthetic-operator-fixture' } });
          assert.equal(authorized.status, 200);
          const identity = await authorized.json();
          assert.equal(identity.service, 'promptos');
          assert.equal(identity.release_sha, process.env.SOURCE_SHA);
          assert.equal(identity.providers.openai.state, 'INTEGRATED');
          assert.equal(identity.authority, 'none');
          console.log('Local protected runtime started and proved source identity; no provider request made.');
          JS

  deploy-runtime:
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: promptos-provider-production
      cancel-in-progress: false
    env:
      EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
      DISPATCH_SHA: ${{ github.sha }}
      DISPATCH_ACTOR: ${{ github.actor }}
      TRIGGERING_ACTOR: ${{ github.triggering_actor }}
      DISPATCH_REF: ${{ github.ref }}
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PROMPTOS_OPENAI_MODEL: ${{ vars.PROMPTOS_OPENAI_MODEL }}
      PROMPTOS_PUBLIC_URL: ${{ vars.PROMPTOS_PUBLIC_URL }}
      PROMPTOS_PROVIDER_URL: ${{ vars.PROMPTOS_PROVIDER_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enforce founder, current main, and exact dispatch head
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'jussray/promptos'
          test "$DISPATCH_ACTOR" = 'jussray'
          test "$TRIGGERING_ACTOR" = 'jussray'
          test "$DISPATCH_REF" = 'refs/heads/main'
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_HEAD_SHA" = "$DISPATCH_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(gh api repos/jussray/promptos/git/ref/heads/main --jq .object.sha)" = "$EXPECTED_HEAD_SHA"
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit
          for name in ['PROMPTOS_PUBLIC_URL', 'PROMPTOS_PROVIDER_URL']:
              url = urlsplit(os.environ.get(name, ''))
              if url.scheme != 'https' or not url.hostname or url.username or url.password or url.query or url.fragment or url.path not in ['', '/']:
                  raise SystemExit(f'{name} must be a configured HTTPS origin before deployment')
          PY
      - name: Deploy with existing project keys and preserve installed secrets
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PROMPTOS_AI_OPERATOR_KEY: ${{ secrets.PROMPTOS_AI_OPERATOR_KEY }}
        run: |
          set -euo pipefail
          secret_file="$RUNNER_TEMP/promptos-existing-provider-secrets.json"
          trap 'rm -f "$secret_file"' EXIT
          node scripts/prepare-provider-deploy.mjs
          # Recheck main after observation and immediately before production mutation.
          test "$(gh api repos/jussray/promptos/git/ref/heads/main --jq .object.sha)" = "$EXPECTED_HEAD_SHA"
          npx --yes wrangler@4.110.0 deploy --config wrangler.provider.jsonc \
            --var "PROMPTOS_RELEASE_SHA:$EXPECTED_HEAD_SHA" \
            --var "PROMPTOS_OPENAI_MODEL:$PROMPTOS_OPENAI_MODEL" \
            --secrets-file "$secret_file"

  # SECURITY BOUNDARY: provider credentials are never exposed to pull-request-controlled code.
  # PR success means source-safe candidate only, never production VERIFIED.
  # The privileged live witness runs from trusted main and must pass before any
  # production-runtime VERIFIED claim or founder-authorized publication.
  live-witness:
    if: >-
      always() && needs.contract.result == 'success' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_dispatch' && needs.deploy-runtime.result == 'success'))
    name: PromptOS trusted-main live provider witness
    runs-on: ubuntu-latest
    needs: [contract, deploy-runtime]
    env:
      PROMPTOS_PUBLIC_URL: ${{ vars.PROMPTOS_PUBLIC_URL }}
      PROMPTOS_PROVIDER_URL: ${{ vars.PROMPTOS_PROVIDER_URL }}
      PROMPTOS_AI_OPERATOR_KEY: ${{ secrets.PROMPTOS_AI_OPERATOR_KEY }}
      PROMPTOS_RUNTIME_PROOF_PROVIDER: ${{ vars.PROMPTOS_RUNTIME_PROOF_PROVIDER || 'openai' }}
      EXPECTED_HEAD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require configured deployed runtime witness
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PROMPTOS_PUBLIC_URL" || { echo 'PROMPTOS_PUBLIC_URL repository variable is required' >&2; exit 1; }
          test -n "$PROMPTOS_PROVIDER_URL" || { echo 'PROMPTOS_PROVIDER_URL repository variable is required' >&2; exit 1; }
          test -n "$PROMPTOS_AI_OPERATOR_KEY" || { echo 'PROMPTOS_AI_OPERATOR_KEY repository secret is required' >&2; exit 1; }
          printf '%s\n' "$EXPECTED_HEAD_SHA" | grep -Eq '^[0-9a-f]{40}$'
      - name: Install Playwright runtime
        run: npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.61.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Prove exact deployed provider runtime
        run: node e2e/runtime-provider-proof.mjs
      - name: Retain sanitized runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promptos-runtime-proof-${{ github.sha }}
          path: artifacts/promptos-runtime-proof
          if-no-files-found: error
          retention-days: 14
