name: Deployment Candidate Contract

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - fix/main-authority-contract
  workflow_dispatch:

permissions:
  contents: read
  pages: read

env:
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  candidate-lease:
    name: Deployment Candidate Contract
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Check out exact proof head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact proof head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"
      - name: Verify founder-gated GitHub Pages publication source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-pages-publication-source.mjs
      - name: Syntax-check Python authority guards
        run: python3 -m py_compile scripts/deploy_candidate_guard.py scripts/test_deploy_candidate_guard.py
      - name: Attack deployment candidate lease
        run: python3 scripts/test_deploy_candidate_guard.py
      - name: Syntax-check provider protection verifier
        run: node --check scripts/verify-main-provider-protection.mjs
      - name: Enforce provider-required checks before merge
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-main-provider-protection.mjs
      - name: Report provider protection on authority repair branch
        if: github.ref == 'refs/heads/fix/main-authority-contract'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROMPTOS_AUTHORITY_REPORT_ONLY: "1"
        run: node scripts/verify-main-provider-protection.mjs
