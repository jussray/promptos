name: PromptOS Social Analytics Contract

on:
  pull_request:
    paths:
      - "src/social-analytics-routing-context.mjs"
      - "src/social-analytics-routing-context.test.mjs"
      - ".github/workflows/social-analytics-contract.yml"
  push:
    branches: [main]
    paths:
      - "src/social-analytics-routing-context.mjs"
      - "src/social-analytics-routing-context.test.mjs"
      - ".github/workflows/social-analytics-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    name: Verify exact social analytics receipt routing
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false
      - name: Record and verify exact head
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Syntax check adapter
        run: node --check src/social-analytics-routing-context.mjs
      - name: Run exact receipt routing tests
        run: node --test src/social-analytics-routing-context.test.mjs
