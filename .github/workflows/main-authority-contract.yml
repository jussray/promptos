name: PromptOS Main Authority Contract

on:
  push:
    branches:
      - main
      - fix/main-authority-contract
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.sha }}

jobs:
  verify:
    name: Verify main mutation and provider protection authority
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - name: Check out exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Syntax-check main authority verifiers
        run: |
          node --check scripts/verify-main-push-authority.mjs
          node --check scripts/verify-main-provider-protection.mjs

      - name: Verify founder-owned non-force main push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PROMPTOS_REPOSITORY: ${{ github.repository }}
          PROMPTOS_REF: ${{ github.ref }}
          PROMPTOS_ACTOR: ${{ github.actor }}
          PROMPTOS_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          PROMPTOS_FORCED: ${{ toJSON(github.event.forced) }}
          PROMPTOS_BEFORE_SHA: ${{ github.event.before }}
          PROMPTOS_AFTER_SHA: ${{ github.event.after }}
        run: node scripts/verify-main-push-authority.mjs

      - name: Verify main push is an ancestry-preserving fast-forward
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail
          git cat-file -e "${BEFORE_SHA}^{commit}"
          git cat-file -e "${AFTER_SHA}^{commit}"
          git merge-base --is-ancestor "$BEFORE_SHA" "$AFTER_SHA"

      - name: Report live provider protection on review branch
        if: github.ref != 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROMPTOS_AUTHORITY_REPORT_ONLY: "1"
        run: node scripts/verify-main-provider-protection.mjs

      - name: Enforce provider-required checks on main
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-main-provider-protection.mjs
  live-main-audit:
    name: Live main and exact candidate ancestry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live main, current PR head, and ancestry (read-only)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_HEAD_SHA: ${{ inputs.target_sha || github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          sha_pattern='^[0-9a-f]{40}$'
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          [[ "$current_main" =~ $sha_pattern ]] || { echo "::error::Cannot resolve live main SHA"; exit 1; }
          [[ "$EVENT_HEAD_SHA" =~ $sha_pattern ]] || { echo "::error::Invalid candidate SHA"; exit 1; }
          candidate="$EVENT_HEAD_SHA"
          if [[ -n "$PR_NUMBER" ]]; then
            live_pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
            live_head="$(jq -r '.head.sha // empty' <<<"$live_pr")"
            live_base="$(jq -r '.base.sha // empty' <<<"$live_pr")"
            live_base_ref="$(jq -r '.base.ref // empty' <<<"$live_pr")"
            [[ "$live_base_ref" == "main" ]] || { echo "::error::PR targets ${live_base_ref}, not main"; exit 1; }
            [[ "$live_head" == "$EVENT_HEAD_SHA" ]] || { echo "::error::PR head advanced; event proof is stale"; exit 1; }
            echo "PR base snapshot: ${live_base}; authoritative comparison uses live main ${current_main}"
            candidate="$live_head"
          fi
          merge_base="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${current_main}...${candidate}" --jq '.merge_base_commit.sha')"
          [[ "$merge_base" == "$current_main" ]] || {
            echo "::error::Candidate is not based on live main ${current_main}. Update the branch and rerun exact-head checks."
            exit 1
          }
          if [[ "$GITHUB_REF" == "refs/heads/main" && "$candidate" != "$current_main" ]]; then
            echo "::error::This main run is superseded by ${current_main}"
            exit 1
          fi
          final_main="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          [[ "$final_main" == "$current_main" ]] || { echo "::error::Main advanced during audit; evidence expired"; exit 1; }
          if [[ -n "$PR_NUMBER" ]]; then
            final_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
            [[ "$final_head" == "$candidate" ]] || { echo "::error::PR head advanced during audit"; exit 1; }
          fi
          {
            echo "### Live main candidate audit"
            echo "- Repository: ${GITHUB_REPOSITORY}"
            echo "- Live main: ${current_main}"
            echo "- Candidate: ${candidate}"
            echo "- Merge base: ${merge_base}"
            echo "- Scope: Git ancestry and exact SHA only; tests, merge authorization, deployment and runtime remain separate."
          } >> "$GITHUB_STEP_SUMMARY"
