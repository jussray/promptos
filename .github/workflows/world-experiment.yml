name: PromptOS World Experiment Contract

on:
  pull_request:
    paths:
      - "src/world-experiment.js"
      - "scripts/verify-world-experiment.mjs"
      - ".github/workflows/world-experiment.yml"
  push:
    branches: [main]
    paths:
      - "src/world-experiment.js"
      - "scripts/verify-world-experiment.mjs"
      - ".github/workflows/world-experiment.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: promptos-world-experiment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify world experiment contract
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false
      - name: Verify exact head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify experiment intent contract
        run: node scripts/verify-world-experiment.mjs
