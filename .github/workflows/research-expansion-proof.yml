name: PromptOS Research Expansion Proof

on:
  push:
    branches:
      - main
      - fix/research-expansion-150
    paths:
      - "src/catalog-runtime/**"
      - "scripts/verify-catalog-runtime.mjs"
      - "e2e/research-expansion-proof.mjs"
      - ".github/workflows/research-expansion-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.sha }}
  PROMPTOS_BASE_URL: http://127.0.0.1:4173
  PROMPTOS_RESEARCH_PROOF_DIR: artifacts/promptos-research-expansion-proof

concurrency:
  group: promptos-research-expansion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify 150 research prompts and rendered catalog
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify catalog runtime contract
        run: node scripts/verify-catalog-runtime.mjs

      - name: Generate catalog quality receipt
        run: node scripts/generate-catalog.mjs

      - name: Install isolated Playwright browser client
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.61.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start PromptOS source server
        shell: bash
        run: |
          python3 -m http.server 4173 > /tmp/promptos-research-server.log 2>&1 &
          echo $! > /tmp/promptos-research-server.pid
          for attempt in {1..30}; do
            curl --fail --silent "$PROMPTOS_BASE_URL/" >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/promptos-research-server.log
          exit 1

      - name: Prove research expansion in desktop and mobile Chromium
        run: node e2e/research-expansion-proof.mjs

      - name: Stop PromptOS source server
        if: always()
        shell: bash
        run: test ! -f /tmp/promptos-research-server.pid || kill "$(cat /tmp/promptos-research-server.pid)" || true

      - name: Retain research expansion proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promptos-research-expansion-${{ env.EXPECTED_HEAD_SHA }}
          path: |
            artifacts/promptos-research-expansion-proof
            artifacts/promptos-catalog-quality.json
          if-no-files-found: error
          retention-days: 14
