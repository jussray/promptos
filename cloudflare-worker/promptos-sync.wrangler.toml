name = "promptos-sync-worker"
main = "promptos-sync.js"
compatibility_date = "2026-09-04"

[vars]
PROMPTOS_ALLOWED_ORIGIN = "https://jussray.github.io"
# PROMPTOS_EXPECTED_SOURCE_SHA is release-specific and intentionally omitted here.
# The provider/deploy layer must set an exact 40-character runtime SHA; state routes
# fail closed until it is configured and read back.

[secrets]
required = ["PROMPTOS_SYNC_SECRET"]

[[durable_objects.bindings]]
name = "PROMPTOS_STATE"
class_name = "PromptOSStateStore"

[exports.PromptOSStateStore]
type = "durable-object"
storage = "sqlite"
